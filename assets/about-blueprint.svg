<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-labelledby="planTitle planDesc">
  <title id="planTitle">Projekt architektoniczny</title>
  <desc id="planDesc">Techniczny rzut parteru domu jednorodzinnego na tle niebieskiego rysunku.</desc>
  <defs>
